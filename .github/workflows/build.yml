name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 / GL development packages
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev libwayland-dev libxkbcommon-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Library package (built-in modifiers, textures, objects + example scenes)
        run: |
          build/fdpack package/library
          mkdir -p package/library/Examples package/library/Worlds package/library/Showcase
          cp examples/*.json package/library/Examples/
          cp test_worlds/*.json package/library/Worlds/
          cp tests/scenes/*.json package/library/Showcase/
          cat > package/library/README.txt <<'TXT'
          4DCAD library
          =============
          Examples/, Worlds/, Showcase/  scenes: open them with File > Open.
          Modifiers/*.4dmod.json         modifier definitions: Library > Import (then edit / duplicate them).
          Textures/*.4dtex.json          texture definitions: Library > Import.
          Objects/*.json                 the built-in object library: Library > Import.
          The built-in modifiers and textures are already inside the program; these files are
          editable copies and starting points for your own.
          TXT
          sed -i 's/^          //' package/library/README.txt
          cp README.md CHANGELOG.md package/
          cp build/4DCAD package/
      - name: Upload the library package
        uses: actions/upload-artifact@v4
        with:
          name: 4DCAD-package-linux
          path: package
          if-no-files-found: error

  windows:
    name: Windows exe (MinGW-w64, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Configure
        run: cmake -S . -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DFD_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-win -j 4
      - name: Upload 4DCAD.exe
        uses: actions/upload-artifact@v4
        with:
          name: 4DCAD-windows
          path: build-win/4DCAD.exe
          if-no-files-found: error

  release:
    name: Release (zip with the exe + library, Linux tarball)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 4DCAD-windows
          path: win
      - uses: actions/download-artifact@v4
        with:
          name: 4DCAD-package-linux
          path: pkg
      - name: Build the archives and the release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "V=$V" >> "$GITHUB_ENV"
          # Windows: exe + library + docs
          mkdir -p "4DCAD-$V-windows"
          cp win/4DCAD.exe "4DCAD-$V-windows/"
          cp -r pkg/library pkg/README.md pkg/CHANGELOG.md "4DCAD-$V-windows/"
          zip -r -q "4DCAD-$V-windows.zip" "4DCAD-$V-windows"
          # Linux: binary + library + docs
          mkdir -p "4DCAD-$V-linux"
          cp -r pkg/4DCAD pkg/library pkg/README.md pkg/CHANGELOG.md "4DCAD-$V-linux/"
          chmod +x "4DCAD-$V-linux/4DCAD"
          tar czf "4DCAD-$V-linux.tar.gz" "4DCAD-$V-linux"
          cp win/4DCAD.exe 4DCAD.exe
          # notes: this version's section of CHANGELOG.md
          awk -v v="## $V" '$0 == v {on = 1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "4DCAD $V" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: 4DCAD ${{ env.V }}
          body_path: notes.md
          files: |
            4DCAD-${{ env.V }}-windows.zip
            4DCAD-${{ env.V }}-linux.tar.gz
            4DCAD.exe
